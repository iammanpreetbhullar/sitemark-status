# Upptime config for status.sitemark.in.
# Copy into a PUBLIC repo created from https://github.com/upptime/upptime (Use this template).
# Public, because a private repo pays for Actions minutes and a check every 5 minutes
# runs ~8,600 times a month.
owner: iammanpreetbhullar
repo: sitemark-status

sites:
  # The marketing site and dashboard.
  - name: Dashboard
    url: https://beta.sitemark.in
    maxResponseTime: 10000
  # Liveness only — the API process answers. Does not touch the database.
  - name: API
    url: https://api.sitemark.in/health
  # A real `SELECT 1` through the API; 503 when the database is unreachable.
  - name: Database
    url: https://api.sitemark.in/health/ready
    maxResponseTime: 10000
  # Live updates between the dashboard and the extension.
  - name: Realtime
    url: https://ws.sitemark.in/health
  # The path the browser extension takes: app proxy → API → database.
  - name: Extension sync
    url: https://beta.sitemark.in/api/proxy/health/ready
    maxResponseTime: 10000

status-website:
  cname: status.sitemark.in
  name: Sitemark Status
  introTitle: "**Sitemark** system status"
  introMessage: Live status of the Sitemark dashboard, API and browser extension.
  navbar:
    - title: Status
      href: /
    - title: Sitemark
      href: https://beta.sitemark.in
